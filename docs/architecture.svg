<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 1086" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Job Hunting Agent · pipeline</title>
<style>
  .node{fill:#fff;stroke:#1F1F1F;stroke-width:1.6}.gate{fill:#EDF3EC;stroke:#4F7A5B;stroke-width:1.6}
