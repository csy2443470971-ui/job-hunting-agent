  .tool{font-size:10.5px;font-weight:700;fill:#2563EB;font-family:ui-monospace,Menlo,monospace}
  .lab{font-size:10.5px;fill:#37352F;text-anchor:middle}.hd{font-size:11px;font-weight:700;fill:#D9730D;letter-spacing:.14em;text-anchor:middle}
  .ic{fill:none;stroke:#1F1F1F;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}.icf{fill:#F3EEE3;stroke:#1F1F1F;stroke-width:1.5;stroke-linejoin:round}
