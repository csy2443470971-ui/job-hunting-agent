  .route{fill:#fff;stroke:#1F1F1F;stroke-width:1.4}.rl{font-size:10.5px;font-weight:700;fill:#2563EB}
  .no{stroke:#B54A3F;stroke-width:1.3;fill:none;stroke-dasharray:3 3}.loop{stroke:#4F7A5B;stroke-width:1.3;fill:none;stroke-dasharray:3 4}
</style>
<defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1F1F1F"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4F7A5B"/></marker><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#B54A3F"/></marker>
