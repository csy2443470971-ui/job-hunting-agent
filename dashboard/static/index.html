<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Hunter Agent</title>
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --page:#FAF9F7; --surface:#FFFFFF; --sunk:#F4F2EF; --hover:#F1EFEB;
    --ink:#1C1917; --ink2:#44403C; --mute:#78716C; --faint:#A8A29E;
    --line:#E7E4DF; --line2:#F0EDE9;
    --green:#16A34A; --blue:#2563EB; --red:#E5372A; --red-strong:#C42A1E; --red-soft:#FDECEA; --orange:#F27420; --orange-soft:#FEF1E7;
    --shadow:0 1px 2px rgba(28,25,23,.04), 0 1px 1px rgba(28,25,23,.03);
    --shadow-lg:0 24px 60px -12px rgba(28,25,23,.28);
    --sans:"Geist", ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --page:#141312; --surface:#1C1B19; --sunk:#232120; --hover:#2A2826; --ink:#F5F3F0; --ink2:#D6D3CE; --mute:#A39E98; --faint:#6F6A64;
    --line:#2E2B28; --line2:#262422; --red-soft:#3A1D1A; --orange-soft:#3A2617; color-scheme:dark; } }
  :root[data-theme="dark"] { --page:#141312; --surface:#1C1B19; --sunk:#232120; --hover:#2A2826; --ink:#F5F3F0; --ink2:#D6D3CE; --mute:#A39E98; --faint:#6F6A64;
    --line:#2E2B28; --line2:#262422; --red-soft:#3A1D1A; --orange-soft:#3A2617; color-scheme:dark; }

  * { box-sizing:border-box; } html, body { margin:0; height:100%; }
  body { background:var(--page); color:var(--ink); font:14.5px/1.5 var(--sans); display:flex; -webkit-font-smoothing:antialiased; }
  a { color:inherit; } button { font:inherit; }
  svg.i { width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* sidebar */
  aside { width:236px; flex:none; background:var(--surface); border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:2px; position:sticky; top:0; height:100vh; }
  .brand { display:flex; align-items:center; gap:10px; padding:4px 8px 22px; font-weight:600; font-size:14.5px; letter-spacing:-.01em; } .brand img { width:28px; height:28px; }
  .nav { all:unset; display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; color:var(--ink2); cursor:pointer; font-weight:500; position:relative; }
  .nav:hover { background:var(--hover); }
  .nav.on { background:var(--sunk); color:var(--ink); } .nav.on svg.i { color:var(--red); }
  .nav .badge { margin-left:auto; }
  .badge { font:600 11.5px/1 var(--mono); color:#fff; background:var(--red); border-radius:999px; padding:4px 7px; }
  .badge:empty { display:none; }

  /* page */
  main { flex:1; min-width:0; overflow:auto; }
  .page { max-width:1100px; margin:0 auto; padding:44px 48px 120px; }
  .ph { display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; }
  h1 { font-size:28px; line-height:1.15; margin:0; letter-spacing:-.025em; font-weight:650; }
  .sub { color:var(--mute); margin:6px 0 0; }

  .seg { display:inline-flex; max-width:100%; overflow-x:auto; gap:2px; padding:3px; background:var(--sunk); border-radius:10px; margin-bottom:20px; }
  .seg button { all:unset; cursor:pointer; white-space:nowrap; padding:6px 12px; border-radius:8px; color:var(--mute); font-weight:500; display:flex; align-items:center; gap:8px; }
  .seg button:hover { color:var(--ink); }
  .seg button.on { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(28,25,23,.08), 0 0 0 1px var(--line); }
  .seg .n { font:500 12px/1 var(--mono); color:var(--faint); } .seg button.on .n { color:var(--red); }

  /* buttons */
  .btn { all:unset; cursor:pointer; display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 14px; border-radius:9px; font-weight:500; font-size:14px;
         border:1px solid var(--line); background:var(--surface); color:var(--ink); transition:background .12s, border-color .12s, box-shadow .12s; white-space:nowrap; }
  .btn:hover { background:var(--hover); }
  .btn.primary { background:var(--red); border-color:var(--red); color:#fff; box-shadow:0 1px 0 rgba(255,255,255,.18) inset, 0 1px 2px rgba(196,42,30,.35); }
  .btn.primary:hover { background:var(--red-strong); border-color:var(--red-strong); }
  .btn.quiet { border-color:transparent; background:transparent; color:var(--ink2); } .btn.quiet:hover { background:var(--hover); }
  .btn.danger:hover { color:var(--red); }
  .btn.outline-red { color:var(--red); border-color:color-mix(in srgb, var(--red) 40%, var(--line)); } .btn.outline-red:hover { background:var(--red-soft); }
  .btn[disabled] { pointer-events:none; background:var(--sunk); border-color:var(--line); color:var(--faint); box-shadow:none; }
  .btn.sm { height:30px; padding:0 11px; font-size:13.5px; }
  .iconbtn { all:unset; cursor:pointer; width:34px; height:34px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; color:var(--mute); }
  .iconbtn:hover { background:var(--hover); color:var(--ink); }

  /* score ring */
  .score { display:flex; flex-direction:column; align-items:center; gap:3px; flex:none; }
  .ring { position:relative; width:48px; height:48px; } .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:600 13px/1 var(--mono); letter-spacing:-.02em; }
  .ring.sm { width:38px; height:38px; } .ring.sm b { font-size:11.5px; }
  .score small { font-size:10.5px; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; font-weight:500; }
  .unrated { font-size:12px; color:var(--faint); border:1px dashed var(--line); border-radius:999px; padding:3px 9px; white-space:nowrap; }

  /* review queue: list on the left, one job at a time on the right */
  .split { display:grid; grid-template-columns:340px minmax(0,1fr); background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; height:calc(100vh - 196px); min-height:540px; }
  .queue { border-right:1px solid var(--line); overflow:auto; background:color-mix(in srgb, var(--sunk) 35%, var(--surface)); }
  .qi { all:unset; box-sizing:border-box; width:100%; display:flex; gap:12px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line2); cursor:pointer; }
  .qi:hover { background:var(--hover); }
  .qi.on { background:var(--surface); box-shadow:inset 3px 0 0 var(--red); }
  .qi .t { flex:1; min-width:0; }
  .qi .c { font-size:12.5px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qi .ti { font-weight:600; font-size:14.5px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qi .st { font-size:12px; margin-top:3px; color:var(--mute); display:flex; align-items:center; gap:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .qi .st > span:last-child, .qi .st { min-width:0; }
  .qi .st.o { color:var(--orange); font-weight:500; } .qi .st.r { color:var(--red); }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }
  .mono { width:36px; height:36px; flex:none; border-radius:10px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:650; font-size:15px; color:var(--ink2); }
  .mono.lg { width:48px; height:48px; border-radius:12px; font-size:19px; background:var(--sunk); }

  .detail { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .d-scroll { flex:1; overflow:auto; padding:28px 34px 34px; }
  .d-head { display:flex; gap:16px; align-items:flex-start; }
  .d-head .tt { flex:1; min-width:0; }
  .d-head .co { font-size:14px; color:var(--mute); font-weight:500; }
  .d-head h2 { margin:2px 0 0; font-size:24px; line-height:1.2; letter-spacing:-.025em; font-weight:650; }
  .back-m { display:none; }
  .facts { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .fact { display:inline-flex; align-items:center; gap:7px; font-size:13px; padding:5px 11px; border:1px solid var(--line); border-radius:999px; color:var(--ink2); background:var(--surface); }
  .fact svg.i { width:14px; height:14px; color:var(--mute); } .fact b { font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }
  .links { display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:14px; font-size:13.5px; }
  .lk { color:var(--red); text-decoration:none; font-weight:500; display:inline-flex; align-items:center; gap:4px; cursor:pointer; } .lk:hover { text-decoration:underline; text-underline-offset:3px; }
  .lk svg.i { width:13px; height:13px; }

  .section { margin-top:30px; }
  .sh { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--line2); }
  .sh h4 { margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.07em; font-weight:600; color:var(--mute); display:flex; align-items:center; gap:7px; }
  .sh h4 .n { font-family:var(--mono); color:var(--faint); letter-spacing:0; }
  .section.ask .sh h4 { color:var(--orange); } .section.ask .sh h4 .n { color:var(--orange); }
  .docs { display:flex; gap:16px; }
  .doc { all:unset; cursor:zoom-in; display:block; width:136px; }
  .doc .pv { width:136px; height:176px; border-radius:8px; border:1px solid var(--line); background:#fff; overflow:hidden; transition:transform .15s, box-shadow .15s; }
  .doc:hover .pv { transform:translateY(-2px); box-shadow:0 10px 24px -10px rgba(28,25,23,.3); }
  .doc img { width:100%; height:100%; object-fit:cover; object-position:top; display:block; }
  .doc .lb { font-size:12.5px; color:var(--ink2); margin-top:8px; font-weight:500; } .doc .lb span { color:var(--mute); font-weight:400; }
  .doc .pv { position:relative; }
  .rbadge { position:absolute; top:6px; right:6px; display:flex; align-items:center; gap:5px; background:var(--ink); color:#fff; font-size:10.5px; font-weight:600; border-radius:999px; padding:3px 8px 3px 6px; }
  .rbadge .spin { width:9px; height:9px; border-width:1.5px; border-color:rgba(255,255,255,.35); border-top-color:#fff; }
  .gdot { position:absolute; top:7px; right:7px; width:11px; height:11px; border-radius:50%; background:var(--green); box-shadow:0 0 0 2px #fff; }
  .rev { width:260px; height:176px; display:flex; flex-direction:column; border:1px solid var(--line); border-radius:8px; background:var(--surface); padding:10px 10px 8px; box-sizing:border-box; }
  .rev .rh { font-size:12.5px; font-weight:600; color:var(--ink2); }
  .rev textarea { flex:1; border:0; resize:none; padding:6px 0; font:inherit; font-size:13px; background:transparent; box-shadow:none !important; outline:none; }
  .rev .rb { display:flex; justify-content:space-between; align-items:center; }
  .rev .mic { width:28px; height:28px; margin:0; }
  .doc .mail { font-size:6.5px; line-height:1.4; white-space:pre-wrap; padding:9px; color:#333; }
  .doc .none { height:100%; display:flex; align-items:center; justify-content:center; text-align:center; font-size:12px; color:var(--faint); padding:12px; background:var(--sunk); }
  .qa { display:flex; flex-direction:column; gap:14px; }
  .field label { display:block; font-size:13.5px; color:var(--ink); margin-bottom:6px; line-height:1.4; font-weight:500; }
  .kv { display:grid; grid-template-columns:minmax(140px, 34%) minmax(0,1fr); }
  .kv > div { padding:10px 0; border-bottom:1px solid var(--line2); font-size:13.5px; overflow-wrap:anywhere; }
  .kv > div:nth-last-child(-n+2) { border-bottom:0; }
  .kv .k { color:var(--mute); padding-right:18px; } .kv .v { color:var(--ink); white-space:pre-wrap; }
  .kv .v input, .kv .v textarea { margin:-4px 0; }
  .why-box { font-size:14px; color:var(--ink2); line-height:1.6; }
  .jd { white-space:pre-wrap; font-size:14px; line-height:1.65; color:var(--ink2); }
  .d-foot { display:flex; align-items:center; gap:8px; padding:14px 34px; border-top:1px solid var(--line); background:var(--surface); }
  .hint { font-size:13px; color:var(--mute); margin-left:6px; }
  .stamp { font-size:13.5px; color:var(--ink2); display:flex; align-items:center; gap:7px; } .stamp svg { color:var(--red); }
  input[type=text], textarea, select { font:inherit; font-size:14px; width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--ink); transition:border-color .12s, box-shadow .12s; }
  input[type=text]:focus, textarea:focus, select:focus { outline:none; border-color:var(--orange); box-shadow:0 0 0 3px color-mix(in srgb, var(--orange) 18%, transparent); }
  textarea { min-height:90px; resize:vertical; line-height:1.5; }
  .banner { display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--ink2); padding:11px 14px; border:1px solid var(--line); border-left:3px solid var(--orange); border-radius:10px; background:var(--surface); margin-bottom:14px; }
  .banner code { font-family:var(--mono); font-size:12.5px; background:var(--sunk); padding:1px 5px; border-radius:4px; }
  .err { font-size:12.5px; color:var(--red); }
  .empty { text-align:center; color:var(--mute); padding:64px 20px; background:var(--surface); border:1px dashed var(--line); border-radius:16px; }
  @media (max-width:760px) {
    .split { grid-template-columns:1fr; height:auto; min-height:0; } .detail { display:none; } .queue { border-right:0; }
    .split.open .detail { display:flex; } .split.open .queue { display:none; }
    .back-m { display:inline-flex; margin:-6px 0 12px -8px; } .d-scroll { padding:20px 18px; } .d-foot { padding:12px 18px; flex-wrap:wrap; }
    .kv { grid-template-columns:1fr; } .kv .k { padding:10px 0 0; border-bottom:0 !important; } .kv .v { padding-top:2px; }
  }

  /* storybook */
  .tell { display:grid; grid-template-columns:minmax(0,1fr) 230px; gap:14px; margin-bottom:26px; }
  .composer { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:18px 18px 12px; display:flex; flex-direction:column; transition:border-color .12s, box-shadow .12s; }
  .composer:focus-within { border-color:color-mix(in srgb, var(--orange) 55%, var(--line)); box-shadow:0 0 0 4px color-mix(in srgb, var(--orange) 12%, transparent); }
  .composer h2 { margin:0 0 4px; font-size:18px; letter-spacing:-.015em; font-weight:620; }
  .composer textarea { border:0; padding:6px 0; min-height:92px; box-shadow:none !important; font-size:15px; resize:none; background:transparent; }
  .composer .try { display:flex; gap:6px; flex-wrap:wrap; margin:4px 0 12px; }
  .pill { all:unset; cursor:pointer; font-size:13px; padding:5px 11px; border:1px solid var(--line); border-radius:999px; color:var(--ink2); background:var(--surface); transition:all .12s; }
  .pill:hover { border-color:var(--orange); color:var(--orange); background:var(--orange-soft); }
  .composer .bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; border-top:1px solid var(--line2); padding-top:10px; }
  .attached { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--ink2); background:var(--sunk); border-radius:8px; padding:4px 6px 4px 9px; max-width:220px; }
  .attached span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .attached button { all:unset; cursor:pointer; color:var(--mute); display:flex; } .attached button:hover { color:var(--red); }
  .mic { all:unset; cursor:pointer; width:34px; height:34px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; color:var(--ink2); border:1px solid var(--line); margin-left:auto; }
  .mic:hover { color:var(--red); border-color:color-mix(in srgb, var(--red) 40%, var(--line)); }
  .mic.on { background:var(--red); color:#fff; border-color:var(--red); animation:pulse 1.3s infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(229,55,42,.35); } 60% { box-shadow:0 0 0 8px rgba(229,55,42,0); } }
  .drop { border:1.5px dashed var(--line); border-radius:16px; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:8px; padding:18px; cursor:pointer; color:var(--mute); font-size:13px; transition:all .15s; }
  .drop .di { width:42px; height:42px; border-radius:12px; background:var(--sunk); display:flex; align-items:center; justify-content:center; color:var(--ink2); }
  .drop b { color:var(--ink); font-size:14px; font-weight:600; }
  .drop:hover, .drop.over { border-color:var(--orange); color:var(--ink2); } .drop.over { background:var(--orange-soft); } .drop.over .di, .drop:hover .di { color:var(--orange); }
  .status { display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink2); margin:-12px 0 20px; }
  .spin { width:14px; height:14px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--red); animation:sp .8s linear infinite; } @keyframes sp { to { transform:rotate(360deg); } }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:16px; }
  .progress { height:5px; background:var(--sunk); border-radius:5px; overflow:hidden; margin:12px 0 8px; } .progress i { display:block; height:100%; background:linear-gradient(90deg, var(--orange), var(--red)); border-radius:5px; transition:width .4s; }
  .change .plus { color:var(--green); font-weight:600; }
  .change { font-size:13.5px; padding:10px 0; border-top:1px solid var(--line2); } .change s { color:var(--faint); } .change .w { font-size:12px; color:var(--mute); margin-bottom:3px; }
  .sec { font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:600; color:var(--mute); margin:28px 0 10px; }
  .sugg { display:flex; gap:16px; align-items:flex-start; } .sugg .x { flex:1; min-width:0; font-size:14px; } .sugg .x .w { font-size:12.5px; color:var(--mute); margin-bottom:4px; }
  .sugg s { color:var(--faint); display:block; font-size:13px; }

  .reader { display:grid; grid-template-columns:200px minmax(0,1fr); background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; min-height:420px; }
  .toc { border-right:1px solid var(--line2); padding:14px 10px; display:flex; flex-direction:column; gap:1px; background:color-mix(in srgb, var(--sunk) 40%, var(--surface)); }
  .toc .h { font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; font-weight:600; color:var(--mute); padding:4px 10px 8px; }
  .toc button { all:unset; cursor:pointer; padding:7px 10px; border-radius:8px; font-size:13.5px; color:var(--ink2); text-transform:capitalize; }
  .toc button:hover { background:var(--hover); } .toc button.on { background:var(--surface); color:var(--ink); font-weight:550; box-shadow:inset 2px 0 0 var(--red), 0 0 0 1px var(--line); }
  .toc .back { margin-top:auto; padding-top:12px; border-top:1px solid var(--line2); }
  .toc .back button { display:flex; white-space:nowrap; font-size:13px; align-items:center; gap:7px; color:var(--mute); text-transform:none; } .toc .back button:hover { color:var(--ink); }
  .toc .back button[disabled] { opacity:.45; pointer-events:none; }
  .md { padding:26px 34px 40px; line-height:1.65; font-size:14.5px; max-width:760px; overflow-wrap:anywhere; }
  .md h1 { font-size:22px; } .md h2 { font-size:17px; margin:30px 0 8px; letter-spacing:-.01em; } .md h3 { font-size:15px; margin:22px 0 6px; }
  .md hr { border:0; border-top:1px solid var(--line2); margin:26px 0; } .md code { font-family:var(--mono); font-size:12.5px; background:var(--sunk); padding:1px 5px; border-radius:4px; }
  .md table { border-collapse:collapse; font-size:13.5px; display:block; overflow-x:auto; } .md td, .md th { border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top; }
  .md a { color:var(--red); }

  /* activity */
  .feed { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
  .ev { display:grid; grid-template-columns:110px 92px minmax(0,1fr); gap:14px; padding:12px 18px; border-bottom:1px solid var(--line2); font-size:13.5px; align-items:baseline; }
  .ev:last-child { border-bottom:0; }
  .ev time { font:500 12px var(--mono); color:var(--mute); }
  .node { justify-self:start; font:500 11.5px/1 var(--mono); padding:4px 7px; border-radius:6px; background:var(--sunk); color:var(--ink2); }
  .node.apply, .node.review { background:var(--red-soft); color:var(--red-strong); } .node.learn, .node.storybook { background:var(--orange-soft); color:#B4530F; }
  .ev .d { color:var(--mute); font-size:13px; margin-top:2px; overflow-wrap:anywhere; }

  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink); color:var(--page); padding:10px 16px; border-radius:10px; font-size:13.5px; box-shadow:var(--shadow-lg); z-index:60; }
  .stg { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; color:var(--c); border:1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius:999px; padding:1px 8px; }
  .stg::before { content:""; width:6px; height:6px; border-radius:50%; background:var(--c); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin:-6px 0 14px; }
  /* Applied: replies on top, three outcome boxes below */
  .aw, .box { background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:16px 18px; }
  .aw-h { display:flex; align-items:center; gap:8px; margin-bottom:8px; } .aw-h h3 { margin:0; font-size:15px; font-weight:620; } .aw-h .n { font:500 12px/1 var(--mono); color:var(--faint); }
  .aw-h .bd { width:9px; height:9px; border-radius:50%; }
  .rp { all:unset; box-sizing:border-box; width:100%; display:flex; gap:12px; align-items:flex-start; padding:11px 8px; border-top:1px solid var(--line2); cursor:pointer; border-radius:10px; }
  .rp:first-of-type { border-top:0; } .rp:hover { background:var(--hover); }
  .rp-t { flex:1; min-width:0; font-size:13.5px; } .rp-t p { margin:3px 0 0; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rp .rs { color:var(--mute); font-size:12.5px; white-space:nowrap; }
  .rp-empty { color:var(--mute); font-size:13.5px; padding:6px 2px; }
  .boxes { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; margin-top:14px; }
  .bi { all:unset; box-sizing:border-box; width:100%; display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:10px 8px; border-top:1px solid var(--line2); cursor:pointer; border-radius:10px; font-size:13.5px; }
  .bi:first-of-type { border-top:0; } .bi:hover, .bi.on { background:var(--hover); }
  .bi span { color:var(--mute); grid-column:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .bi .stg { grid-column:2; grid-row:1 / span 2; align-self:center; }
  .ap-detail { display:flex !important; margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden; }
  @media (max-width: 900px) { .boxes { grid-template-columns:1fr; } }
  .reply { padding:12px 0; border-top:1px solid var(--line2); font-size:13.5px; } .reply:first-child { border-top:0; }
  .reply .rh { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:4px; } .reply .rs { color:var(--mute); font-size:12.5px; }
  .reply p { margin:4px 0 0; color:var(--ink2); }
  .side-foot { margin-top:auto; margin-bottom:56px; padding:12px 6px 4px; border-top:1px solid var(--line2); }   /* clears the page editor's corner buttons */
  .side-foot .refresh { width:100%; box-sizing:border-box; justify-content:center; }
  .side-foot .refresh.busy svg { animation:sp 1s linear infinite; }
  .side-foot .cap { font-size:12px; color:var(--mute); margin-top:7px; text-align:center; min-height:16px; }
  @media (max-width:760px) { .side-foot { margin:0 0 0 auto; border:0; padding:0; } .side-foot .cap { display:none; } }
  /* modal */
  .modal { position:fixed; inset:0; background:rgba(20,18,16,.42); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; padding:28px; z-index:50; animation:fade .14s ease-out; }
  @keyframes fade { from { opacity:0; } }
  .win { background:var(--surface); border-radius:16px; width:min(760px,100%); max-height:86vh; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); animation:rise .18s ease-out; }
  @keyframes rise { from { transform:translateY(8px); opacity:.6; } }
  .win-h { display:flex; align-items:flex-start; gap:14px; padding:18px 20px; border-bottom:1px solid var(--line2); }
  .job-t { flex:1; min-width:0; } .job-co { font-size:13px; color:var(--mute); font-weight:500; } .job-t h3 { margin:1px 0 0; font-size:17px; letter-spacing:-.015em; font-weight:620; }
  .win-b { padding:20px 24px 28px; overflow:auto; white-space:pre-wrap; font-size:14px; line-height:1.65; color:var(--ink2); }
  .win.img { width:auto; max-width:min(900px,100%); } .win.img .win-b { padding:16px; background:var(--sunk); white-space:normal; } .win.img img { display:block; max-width:100%; height:auto; border-radius:6px; box-shadow:0 2px 10px rgba(0,0,0,.1); margin:0 auto; }

  @media (max-width:760px) {
    body { display:block; } aside { position:static; width:auto; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; padding:10px 12px; border-right:0; border-bottom:1px solid var(--line); }
    .brand { padding:4px 10px 4px 4px; } .page { padding:24px 16px 80px; }
    .tell { grid-template-columns:1fr; } .drop { min-height:120px; }
    .reader { grid-template-columns:1fr; } .toc { flex-direction:row; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--line2); } .toc .h { display:none; } .toc .back { margin:0; border:0; padding:0; }
    .md { padding:20px 18px 30px; } .fgrid { grid-template-columns:1fr; } .ev { grid-template-columns:1fr; gap:4px; } .li { flex-wrap:wrap; }
  }
</style>
</head>
<body>
<aside data-lve-skip>
  <div class="brand"><img src="/static/icon.png" alt=""><span>Job Hunter Agent</span></div>
  <button class="nav on" data-tab="jobs"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/></svg>Job applications <span class="badge" id="c-jobs"></span></button>
  <button class="nav" data-tab="storybook"><svg class="i" viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2.5Z"/><path d="M4 19.5A2 2 0 0 0 6 21h13M9 7h6"/></svg>Storybook</button>
  <button class="nav" data-tab="activity"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Activity</button>
  <div class="side-foot">
    <button class="btn refresh" id="refresh" onclick="refreshJobs()"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg><span>Refresh</span></button>
    <div class="cap" id="refresh-cap"></div>
  </div>
</aside>
<main><div class="page" id="page" data-lve-skip></div></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = (p, o) => fetch(p, o).then(r => r.json());
const post = (p, b) => api(p, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(b || {})});
const day = s => s ? new Date(s).toLocaleDateString(undefined, {month:'short', day:'numeric'}) : '';
let tab = 'jobs', sub = 'review', pbFile = null, poll = null;

const I = {
  ext: '<svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  pen: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg>',
  mic: '<svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  up: '<svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>',
  clip: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="m20 11-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/></svg>',
  undo: '<svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  alert: '<svg class="i" viewBox="0 0 24 24" style="width:13px;height:13px"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>',
  send: '<svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
};
const SRC = {Jev: 'Jev', model: 'Fit', keyword: 'Keyword'};
const SRC_TIP = {Jev: 'Jev match probability', model: 'Model fit score (Jev not connected)', keyword: 'Keyword match against your roles (not yet model-scored)'};
let gid = 0;
// your scale: 90+ green, 80+ blue, 50+ orange; under 50 is never applied to
const tier = v => v >= 90 ? 'var(--green)' : v >= 80 ? 'var(--blue)' : v >= 50 ? 'var(--orange)' : 'var(--faint)';
function ring(c, small) {
  if (c.match == null) return '<span class="unrated" title="Not rated yet">Not rated</span>';
  const r = 20, C = 2 * Math.PI * r, v = Math.max(0, Math.min(100, c.match)), col = tier(v);
  return `<div class="score" title="${SRC_TIP[c.match_src] || ''}"><div class="ring ${small ? 'sm' : ''}"><svg viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="${r}" stroke="var(--sunk)" stroke-width="4" fill="none"/><circle cx="24" cy="24" r="${r}" stroke="${col}" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="${C * v / 100} ${C}"/></svg><b style="color:${col}">${v}</b></div>${small ? '' : `<small>${SRC[c.match_src] || ''}</small>`}</div>`;
}
const mono = name => `<div class="mono">${esc((name || '?').trim()[0] || '?').toUpperCase()}</div>`;

function modal(head, bodyHtml, cls = '') {
  const m = document.createElement('div'); m.className = 'modal'; m.setAttribute('data-lve-skip', '');
  m.innerHTML = `<div class="win ${cls}"><div class="win-h">${head}<button class="iconbtn" aria-label="Close">${I.x}</button></div><div class="win-b">${bodyHtml}</div></div>`;
  const close = () => { m.remove(); document.removeEventListener('keydown', k); };
  const k = e => { if (e.key === 'Escape') close(); };
  m.onclick = e => { if (e.target === m || e.target.closest('.iconbtn')) close(); };
  document.addEventListener('keydown', k); document.body.appendChild(m);
}
async function showJD(id) {
  const d = await api(`/api/jobs/${id}/description`);
  modal(`${mono(d.company)}<div class="job-t"><div class="job-co">${esc(d.company)}${d.location ? ' · ' + esc(d.location) : ''}</div><h3>${esc(d.title)}</h3></div>${d.url ? `<a class="btn sm" href="${esc(d.url)}" target="_blank">Open posting${I.ext}</a>` : ''}`,
    esc(d.text || 'No description saved for this posting.'));
}
function showImg(src, company, label, open) {
  modal(`<div class="job-t"><div class="job-co">${esc(company)}</div><h3>${esc(label)}</h3></div><a class="btn sm" href="${open}" target="_blank">Open full size${I.ext}</a>`, `<img src="${src}" alt="">`, 'img');
}
async function setStage(id, stage) { await post(`/api/applications/${id}/stage`, {stage}); toast('Status updated'); render(); }
function ago(s) { if (!s) return ''; const m = Math.round((Date.now() - new Date(s)) / 6e4); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago'; }
async function showRefresh() {
  const r = await api('/api/refresh'), b = $('#refresh'), cap = $('#refresh-cap');
  b.classList.toggle('busy', r.running); b.disabled = r.running; b.querySelector('span').textContent = r.running ? 'Refreshing…' : 'Refresh';
  const bits = r.at ? [`${r.new} new ${r.new === 1 ? 'job' : 'jobs'}`, r.replies ? `${r.replies} ${r.replies === 1 ? 'reply' : 'replies'}` : '', r.updated ? 'app updated' : ''].filter(Boolean).join(' · ') : '';
  cap.textContent = r.running ? 'Updating, checking email and job boards' : r.failed ? 'Refresh failed: see data/refresh.log' : r.at ? `Updated ${ago(r.at)} · ${bits}` : 'Not refreshed yet';
  return r;
}
// one button for everything: the app's newest version, new jobs, and replies that move each application along
async function refreshJobs() {
  await post('/api/refresh'); await showRefresh();
  clearInterval(window._rp); window._rp = setInterval(async () => {
    const r = await showRefresh(); if (r.running) return;
    clearInterval(window._rp);
    if (r.failed) return toast('Refresh failed');
    toast([`${r.new} new ${r.new === 1 ? 'job' : 'jobs'}`, `${r.replies || 0} new ${r.replies === 1 ? 'reply' : 'replies'}`, r.updated ? `app updated (${r.updated} change${r.updated === 1 ? '' : 's'})` : 'app up to date'].join(' · '));
    if (r.update_error) toast(r.update_error);
    if (r.restarting) {                      // the server is starting again on the new code: wait for it, then reload
      $('#refresh-cap').textContent = 'Restarting on the new version…';
      for (let i = 0; i < 40; i++) { await new Promise(ok => setTimeout(ok, 750)); try { await fetch('/api/config'); return location.reload(); } catch (e) {} }
    } else if (r.updated) setTimeout(() => location.reload(), 1200);
    else render();
  }, 3000);
}
async function decide(id, what) { const r = await post(`/api/applications/${id}/${what}`); if (r && r.msg) toast(r.msg); sel[sub] = null; render(); }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 5000); }
async function reject(id) { const why = prompt('Why not? (optional; the agent learns from it)'); if (why === null) return; await post(`/api/applications/${id}/reject`, {note: why}); sel[sub] = null; render(); }
async function saveAnswers(id, isEmail, b) {
  const box = $('#detail');
  if (isEmail) await post(`/api/applications/${id}/edit`, {email_to: box.querySelector('[data-k=to]').value, email_subject: box.querySelector('[data-k=subject]').value, email_body: box.querySelector('[data-k=body]').value});
  else await post(`/api/applications/${id}/answers`, {answers: [...box.querySelectorAll('[data-q]')].map(i => ({q: i.dataset.q, a: i.value})).filter(x => x.a.trim())});
  b.innerHTML = I.check + 'Saved'; editing = false; setTimeout(() => render(), 400);
}
async function prep(id, b) { b.innerHTML = '<span class="spin"></span>Preparing…'; b.disabled = true; const r = await post(`/api/jobs/${id}/prepare`); if (r && r.ok === false) { alert(r.msg); return render(); } watchPrep(); }
async function skip(id) { await post(`/api/jobs/${id}/skip`); sel[sub] = null; render(); }
function watchPrep() { clearInterval(poll); poll = setInterval(async () => { const t = await api('/api/board?tab=todo'); if (!t.some(x => x.preparing === 'running')) { clearInterval(poll); render(); } }, 3000); }

let sel = {review: null, todo: null, applied: null}, editing = false, mobileOpen = false;
const keyOf = c => sub === 'todo' ? c.job_id : c.app_id;
const PIN = '<svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const CASH = '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>';
const CAL = '<svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

const STAGE = {applied: ['Applied', 'var(--faint)'], confirmation: ['Received', 'var(--mute)'], next_step: ['Next step', 'var(--blue)'],
  interview: ['Interview', 'var(--green)'], offer: ['Offer', 'var(--orange)'], rejected: ['Rejected', 'var(--ink2)']};
function stageOf(c) {
  if (c.status !== 'sent') return 'applied';
  if ((c.stage || 'applied') === 'applied' || c.stage === 'confirmation') {
    const days = c.sent_at ? Math.floor((Date.now() - new Date(c.sent_at)) / 864e5) : 0;
    if (days >= 21) return 'quiet';
  }
  return c.stage || 'applied';
}
function stageChip(c) {
  const s = stageOf(c);
  if (s === 'quiet') return '<span class="stg" style="--c:var(--faint)">No reply · 3+ wks</span>';
  const [l, col] = STAGE[s] || STAGE.applied;
  return `<span class="stg" style="--c:${col}">${l}</span>`;
}

function queueItem(c) {
  const needs = (c.needs || []).length;
  const st = sub === 'review' ? (needs ? `<div class="st o"><span class="dot"></span>${needs} ${needs === 1 ? 'question' : 'questions'} for you</div>` : `<div class="st r"><span class="dot"></span>Ready to approve</div>`)
    : sub === 'applied' ? `<div class="st">${stageChip(c)}<span style="margin-left:6px">${c.status === 'sent' ? 'Sent' : 'Approved'} ${day(c.sent_at)}</span></div>`
    : c.preparing === 'running' ? `<div class="st o"><span class="spin"></span>Preparing…</div>` : (c.location ? `<div class="st" style="display:block">${esc(c.location)}</div>` : '');
  return `<button class="qi ${keyOf(c) === sel[sub] ? 'on' : ''}" onclick="pickJob(${keyOf(c)})">${mono(c.company)}<div class="t"><div class="c">${esc(c.company)}</div><div class="ti">${esc(c.title)}</div>${st}</div>${ring(c, true)}</button>`;
}
function pickJob(k) { sel[sub] = k; editing = false; mobileOpen = true; render(); }

function header(c) {
  const facts = [c.location && `<span class="fact">${PIN}${esc(c.location)}</span>`, c.salary && `<span class="fact">${CASH}<b>${esc(c.salary)}</b></span>`, c.start && `<span class="fact">${CAL}Starts ${esc(c.start)}</span>`].filter(Boolean).join('');
  const links = [c.url && `<a class="lk" href="${esc(c.url)}" target="_blank">Job posting${I.ext}</a>`, sub !== 'todo' && `<a class="lk" onclick="showJD(${c.job_id})">Read the description</a>`,
    c.email_to ? `<span style="color:var(--mute)">Send to ${esc(c.email_to)}</span>` : c.apply_url && sub !== 'todo' ? `<a class="lk" href="${esc(c.apply_url)}" target="_blank">Application form${I.ext}</a>` : ''].filter(Boolean).join('');
  return `<button class="btn quiet sm back-m" onclick="mobileOpen=false;render()">← All jobs</button>
    <div class="d-head">${mono(c.company).replace('class="mono"', 'class="mono lg"')}<div class="tt"><div class="co">${esc(c.company)}</div><h2>${esc(c.title)}</h2></div>${ring(c)}</div>
    ${facts ? `<div class="facts">${facts}</div>` : ''}<div class="links">${links}</div>`;
}

function detailApp(c, done) {
  const needs = c.needs || [];
  const shot = c.has_shot
    ? `<button class="doc" onclick="showImg('/screen/${c.app_id}', ${esc(JSON.stringify(c.company))}, 'Application', '/screen/${c.app_id}')"><div class="pv"><img src="/screen/${c.app_id}" alt=""></div><div class="lb">Application <span>· filled form</span></div></button>`
    : c.email_body ? `<div class="doc" style="cursor:default"><div class="pv"><div class="mail"><b>${esc(c.email_subject || '')}</b>\n\n${esc(c.email_body)}</div></div><div class="lb">Email <span>· draft</span></div></div>`
    : `<div class="doc" style="cursor:default"><div class="pv"><div class="none">No form captured</div></div><div class="lb">Application</div></div>`;
  const ask = needs.length && !done ? `<div class="section ask"><div class="sh"><h4>${I.alert}Questions for you <span class="n">${needs.length}</span></h4></div>
      <div class="qa">${needs.map(q => { const o = (c.needs_options || {})[q]; return `<div class="field"><label>${esc(q)}</label>${o && o.length
        ? `<select data-q="${esc(q)}"><option value="">Choose…</option>${o.map(x => `<option>${esc(x)}</option>`).join('')}</select>`
        : `<input type="text" data-q="${esc(q)}" placeholder="Your answer">`}</div>`; }).join('')}</div>
      <div style="margin-top:14px"><button class="btn primary sm" onclick="saveAnswers(${c.app_id}, false, this)">Save answers</button></div></div>` : '';
  const ed = editing && !done;
  const filled = c.email_body
    ? `<div class="kv"><div class="k">To</div><div class="v">${ed ? `<input type="text" data-k="to" value="${esc(c.email_to || '')}">` : esc(c.email_to || '')}</div>
        <div class="k">Subject</div><div class="v">${ed ? `<input type="text" data-k="subject" value="${esc(c.email_subject || '')}">` : esc(c.email_subject || '')}</div>
        <div class="k">Message</div><div class="v">${ed ? `<textarea data-k="body" style="min-height:240px">${esc(c.email_body)}</textarea>` : esc(c.email_body)}</div></div>`
    : `<div class="kv">${c.fields.map(f => `<div class="k">${esc(f.q)}</div><div class="v">${ed ? (f.a.length > 80 ? `<textarea data-q="${esc(f.q)}">${esc(f.a)}</textarea>` : `<input type="text" data-q="${esc(f.q)}" value="${esc(f.a)}">`) : esc(f.a)}</div>`).join('')}</div>`;
  return `<div class="d-scroll">${header(c)}
      ${done ? `<div class="section"><div class="sh"><h4>Status</h4>
        <select style="width:auto" onchange="setStage(${c.app_id}, this.value)">${['applied', 'confirmation', 'next_step', 'interview', 'offer', 'rejected'].map(k => `<option value="${k}" ${(c.stage || 'applied') === k ? 'selected' : ''}>${STAGE[k][0]}</option>`).join('')}</select></div>
        ${(c.replies || []).length ? (c.replies || []).map(r => `<div class="reply"><div class="rh">${stageChip({status: 'sent', stage: r.kind === 'other' ? 'applied' : r.kind})}<b>${esc(r.subject)}</b><span class="rs">${esc((r.sender || '').replace(/<.*>/, ''))} · ${day(r.at)}</span>
          ${r.view_url ? `<a class="lk" href="${esc(r.view_url)}" target="_blank">Open in Gmail${I.ext}</a>` : ''}</div><p>${esc((r.snippet || '').slice(0, 280))}</p></div>`).join('')
          : '<div style="font-size:13.5px;color:var(--mute)">No replies yet. The inbox is checked once a day.</div>'}</div>` : ''}
      <div class="section"><div class="sh"><h4>Documents</h4></div><div class="docs">
        <button class="doc" onclick="showImg('/resume-png/${c.app_id}?v=${REVV[c.app_id] || ''}', ${esc(JSON.stringify(c.company))}, 'Résumé', '/resume/${c.app_id}')"><div class="pv"><img src="/resume-png/${c.app_id}?v=${REVV[c.app_id] || ''}" alt="">${REV[c.app_id] === 'running' ? '<span class="rbadge"><span class="spin"></span>Revising</span>' : REV[c.app_id] === 'done' ? '<span class="gdot" title="Revised"></span>' : ''}</div><div class="lb">Résumé <span>· 1 page</span></div></button>${shot}${done ? '' : reviseBox(c)}</div></div>
      ${ask}
      <div class="section"><div class="sh"><h4>${c.email_body ? 'Email' : 'Filled by the agent'} <span class="n">${c.email_body ? '' : c.fields.length}</span></h4>
        ${done ? '' : ed ? `<span style="display:flex;gap:6px"><button class="btn sm quiet" onclick="editing=false;render()">Cancel</button><button class="btn sm primary" onclick="saveAnswers(${c.app_id}, ${!!c.email_body}, this)">Save</button></span>` : `<button class="btn sm quiet" onclick="editing=true;render()">${I.pen}Edit</button>`}</div>${filled}</div>
    </div>
    <div class="d-foot">${done ? `<span class="stamp">${I.check}${c.status === 'sent' ? 'Sent' : 'Approved'} ${day(c.sent_at)}</span>` : `
      <button class="btn primary" ${needs.length ? 'disabled' : ''} onclick="decide(${c.app_id},'approve')">${I.check}Approve</button>
      <button class="btn danger" onclick="reject(${c.app_id})">Reject</button>
      <span class="hint">${needs.length ? `Answer the ${needs.length === 1 ? 'question' : needs.length + ' questions'} above to approve.` : (c.email_body ? 'Approving queues the email; it goes out with the next send.' : 'Approving submits it in a browser window. Nothing goes out before.')}</span>`}</div>`;
}

function detailTodo(c) {
  return `<div class="d-scroll">${header(c)}
      ${c.why ? `<div class="section"><div class="sh"><h4>Why it fits</h4></div><div class="why-box">${esc(c.why)}</div></div>` : ''}
      ${c.preparing && c.preparing.startsWith('error') ? `<div class="section"><div class="err">${esc(c.preparing)}</div></div>` : ''}
      <div class="section"><div class="sh"><h4>Job description</h4></div><div class="jd" id="jd">Loading…</div></div>
    </div>
    <div class="d-foot"><button class="btn primary" ${c.preparing === 'running' ? 'disabled' : ''} onclick="prep(${c.job_id}, this)">${c.preparing === 'running' ? '<span class="spin"></span>Preparing…' : 'Prepare application'}</button>
      <button class="btn" onclick="skip(${c.job_id})">Skip</button><span class="hint">Prepare writes the résumé and fills the form. It comes back here for review.</span></div>`;
}

async function renderJobs(p) {
  const [rv, td, ap, cfg] = await Promise.all([...['review', 'todo', 'applied'].map(t => api('/api/board?tab=' + t)), api('/api/config')]);
  $('#c-jobs').textContent = rv.length || '';
  const lists = {review: rv, todo: td, applied: ap};
  const names = {review: 'Waiting for review', todo: 'Not started', applied: 'Applied'};
  const list = lists[sub];
  if (!list.some(c => keyOf(c) === sel[sub])) sel[sub] = list.length ? keyOf(list[0]) : null;
  const cur = list.find(c => keyOf(c) === sel[sub]);
  const sa = await api('/api/standing');
  const setup = sa.missing.length ? `<div class="banner" style="border-left-color:var(--red)">${I.alert}<div><b>Before your agent applies anywhere:</b> answer the standing questions (name, work authorization, relocation, self-identification…). ${sa.missing.length} left.
    <a class="lk" onclick="tab='storybook';pbFile='@standing';render()">Answer them now</a></div></div>` : '';
  const banner = setup + (sub === 'todo' && !cfg.jev ? `<div class="banner">${I.alert}<div>Jev isn't connected, so these are ranked by keyword match. Add <code>TYPESAFE_API_KEY</code> to <code>.env</code> to rate every posting with Jev.</div></div>` : '');
  const empty = {review: 'Nothing is waiting for you.', todo: 'Nothing waiting to start.', applied: 'Nothing sent yet.'}[sub];
  const keepScroll = $('.queue') ? $('.queue').scrollTop : 0;
  p.innerHTML = `<div class="ph"><div><h1>Job applications</h1></div>
      <div class="seg" style="margin:0">${Object.keys(names).map(k => `<button class="${k === sub ? 'on' : ''}" onclick="sub='${k}';editing=false;mobileOpen=false;render()">${names[k]}<span class="n">${lists[k].length}</span></button>`).join('')}</div></div>
    ${banner}
    ${sub === 'applied' && ap.length ? appliedBoard(ap, cur) : list.length ? `<div class="split ${mobileOpen ? 'open' : ''}"><div class="queue">${list.map(queueItem).join('')}</div>
      <section class="detail" id="detail">${cur ? (sub === 'todo' ? detailTodo(cur) : detailApp(cur, sub === 'applied')) : ''}</section></div>` : `<div class="empty">${empty}</div>`}`;
  if ($('.queue')) $('.queue').scrollTop = keepScroll;
  if (sub === 'todo' && cur) api(`/api/jobs/${cur.job_id}/description`).then(d => { const el = $('#jd'); if (el) el.textContent = d.text || 'No description saved.'; });
  if (td.some(x => x.preparing === 'running')) watchPrep();
}

// Applied: what came back on top, then where every application stands: heard back, rejected, no reply yet
function appliedBoard(ap, cur) {
  const bucket = c => { const s = stageOf(c); return ['next_step', 'interview', 'offer'].includes(s) ? 'heard' : s === 'rejected' ? 'rejected' : 'waiting'; };
  const replies = ap.flatMap(c => (c.replies || []).map(r => ({ ...r, c }))).sort((a, b) => (b.at || '').localeCompare(a.at || '')).slice(0, 6);
  const top = `<section class="aw"><div class="aw-h"><h3>Replies</h3><span class="n">${replies.length}</span></div>
    ${replies.length ? replies.map(r => `<button class="rp" onclick="sel.applied=${r.c.app_id};render()">${stageChip({status: 'sent', stage: r.kind === 'other' ? 'applied' : r.kind})}
      <div class="rp-t"><b>${esc(r.c.company)}</b> · ${esc(r.subject)}<p>${esc(r.snippet || '')}</p></div><span class="rs">${day(r.at)}</span></button>`).join('')
      : '<div class="rp-empty">No replies yet. The inbox is checked once a day.</div>'}</section>`;
  const boxes = [['heard', 'Heard back', 'var(--green)'], ['rejected', 'Rejected', 'var(--ink2)'], ['waiting', 'No reply yet', 'var(--faint)']].map(([k, l, col]) => {
    const xs = ap.filter(c => bucket(c) === k);
    return `<section class="box"><div class="aw-h"><span class="bd" style="background:${col}"></span><h3>${l}</h3><span class="n">${xs.length}</span></div>
      ${xs.map(c => `<button class="bi ${cur && c.app_id === cur.app_id ? 'on' : ''}" onclick="sel.applied=${c.app_id};render()"><b>${esc(c.company)}</b><span>${esc(c.title)}</span>${stageChip(c)}</button>`).join('') || '<div class="rp-empty">None yet.</div>'}</section>`;
  }).join('');
  return top + `<div class="boxes">${boxes}</div>` + (cur ? `<section class="detail ap-detail" id="detail">${detailApp(cur, true)}</section>` : '');
}

function standingForm(sa) {
  const v = sa.values || {}; let sec = '', html = '';
  for (const q of sa.questions) {
    if (q.section !== sec) { sec = q.section; html += `${html ? '</div>' : ''}<h3 style="margin:26px 0 10px">${esc(sec)}</h3><div class="fgrid">`; }
    const val = v[q.key] || '';
    const input = q.kind === 'select'
      ? `<select data-k="${q.key}"><option value="">Choose…</option>${q.options.map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`
      : `<input type="text" data-k="${q.key}" value="${esc(val)}" placeholder="${esc(q.hint || '')}">`;
    html += `<div class="field ${q.kind === 'text' && q.hint && q.hint.length > 40 ? 'wide' : ''}"><label>${esc(q.label)}${q.required ? ' <span style="color:var(--red)">*</span>' : ''}</label>${input}
      ${q.kind === 'select' && q.hint ? `<div style="font-size:12px;color:var(--mute);margin-top:4px">${esc(q.hint)}</div>` : ''}</div>`;
  }
  return `<h1 style="margin-top:0">Standing answers</h1>
    <p>The questions almost every application asks. Answer them once; the agent fills them on every form and never asks again.
    Starred ones are required: until they are done, the agent prepares and submits nothing. They stay on this computer.</p>
    ${sa.missing.length ? `<div class="banner">${I.alert}<div><b>${sa.missing.length} left:</b> ${sa.missing.map(esc).join(', ')}</div></div>` : ''}
    ${html}</div><div class="edit-f" style="margin-top:22px"><button class="btn primary" onclick="saveStanding(this)">${I.check}Save answers</button></div>`;
}
async function saveStanding(b) {
  const values = {}; document.querySelectorAll('[data-k]').forEach(el => values[el.dataset.k] = el.value);
  const r = await api('/api/standing', {method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({values})});
  toast(r.missing.length ? `Saved. ${r.missing.length} required left.` : 'Saved. Your agent can apply now.'); render();
}

async function renderStorybook(p) {
  const [files, vs, st, props, tell] = await Promise.all([api('/api/playbook'), api('/api/storybook/versions'), api('/api/storybook/learn-status'), api('/api/proposals'), api('/api/agent/tell-status')]);
  const fs = files.filter(f => !f.name.startsWith('_'));
  const sa = await api('/api/standing');
  if (!pbFile) pbFile = sa.missing.length ? '@standing' : (fs[0] && fs[0].name);
  const doc = pbFile && pbFile !== '@standing' ? await api('/api/playbook/' + pbFile) : {text: ''};
  const pend = props.filter(x => x.status === 'pending');
  const running = st.state === 'running';
  const progress = st.state && st.state !== 'idle' ? `<div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><b>${running ? (st.mode === 'add' ? 'Adding to your storybook' : 'Adjusting your storybook') : st.state === 'done' ? 'Storybook updated' : 'Stopped'}</b><span style="font-size:12.5px;color:var(--mute)">${esc(st.reference || '')}</span></div>
      <div class="progress"><i style="width:${st.total ? Math.round(100 * st.done / st.total) : 0}%"></i></div><div style="font-size:12.5px;color:var(--mute)">${running ? 'Now: ' + esc(st.current) : ''} ${st.error ? esc(st.error) : ''}</div>
      ${(st.changes || []).slice(-8).reverse().map(c => `<div class="change"><div class="w">${esc(c.where)} · ${esc(c.why)}</div>${c.before ? `<s>${esc(c.before)}</s>` : ''}<div>${c.before ? '' : '<b class="plus">+</b> '}${esc(c.after)}</div></div>`).join('')}</div>` : '';
  const examples = ['Improve my storybook', 'Change how my résumé is written', 'Change my application strategy'];
  const label = f => f.replace(/^\d+-/, '').replace(/\.md$/, '').replace(/-/g, ' ').replace(/^readme$/i, 'Sources');
  p.innerHTML = `<div class="ph"><div><h1>Storybook</h1><p class="sub">Everything your agent knows about you. Tell it what to change.</p></div></div>
    <div class="tell">
      <div class="composer"><h2>What should your agent know?</h2>
        <textarea id="ask" placeholder="Type, or tap the mic and talk."></textarea>
        <div class="try">${examples.map(x => `<button class="pill" onclick="useEx('${x}')">${x}?</button>`).join('')}</div>
        <div class="bar">${picked.map((f, i) => `<span class="attached">${I.clip}<span>${esc(f.name)}</span><button onclick="picked.splice(${i},1);render()" title="Remove">${I.x}</button></span>`).join('')}
          <button class="mic" id="mic" title="Speak" onclick="speak()">${I.mic}</button>
          <button class="btn primary" ${running ? 'disabled' : ''} onclick="tellAgent()">Send${I.send}</button></div></div>
      <div class="drop" id="drop"><div class="di">${I.up}</div><b>Drop anything</b><span>Old résumés, references, papers, notes, voice memos<br>or <u>browse</u></span><input type="file" id="file" multiple hidden></div>
    </div>
    ${tell.thinking ? '<div class="status"><span class="spin"></span>Thinking about what you said…</div>' : ''}
    ${progress}
    ${pend.length ? `<div class="sec">Suggested changes · ${pend.length}</div>${pend.map(x => `<div class="panel sugg"><div class="x"><div class="w">${esc(x.reason)}</div>${x.before ? `<s>${esc(x.before)}</s>` : ''}${esc(x.after)}</div>
        <div style="display:flex;gap:6px;flex:none"><button class="btn sm primary" onclick="prop(${x.id},'approve')">Apply</button><button class="btn sm quiet" onclick="prop(${x.id},'reject')">Dismiss</button></div></div>`).join('')}` : ''}
    <div class="reader">
      <nav class="toc"><div class="h">Required</div>
        <button class="${pbFile === '@standing' ? 'on' : ''}" onclick="pbFile='@standing';render()" style="display:flex;align-items:center;gap:6px">Standing answers
          ${sa.missing.length ? `<span class="badge" title="${sa.missing.length} left">${sa.missing.length}</span>` : `<span style="color:var(--green);margin-left:auto">${I.check}</span>`}</button>
        <div class="h" style="margin-top:10px">Files</div>${fs.map(f => `<button class="${f.name === pbFile ? 'on' : ''}" onclick="pbFile='${f.name}';render()">${esc(label(f.name))}</button>`).join('')}
        <div class="back"><button ${vs.length ? '' : 'disabled'} onclick="back()" title="${vs.length ? vs.length + ' saved version(s)' : 'No earlier version yet'}">${I.undo}Back to previous version</button></div></nav>
      <article class="md">${pbFile === '@standing' ? standingForm(sa) : (window.marked ? marked.parse(doc.text) : '<pre>' + esc(doc.text) + '</pre>')}</article>
    </div>`;
  const drop = $('#drop'), file = $('#file');
  drop.onclick = () => file.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files); };
  file.onchange = () => pick(file.files);
  if (draft) $('#ask').value = draft;
  $('#ask').oninput = e => { draft = e.target.value; };
  if (tell.thinking) { clearInterval(poll); poll = setInterval(async () => { const t = await api('/api/agent/tell-status'); if (!t.thinking) { clearInterval(poll); if (tab === 'storybook') render(); } }, 3000); }
  if (running) { clearInterval(poll); poll = setInterval(async () => { const s = await api('/api/storybook/learn-status'); if (s.state !== 'running' || tab !== 'storybook') clearInterval(poll); if (tab === 'storybook') render(); }, 2500); }
}
let picked = [], draft = '';
function useEx(x) { const a = $('#ask'); a.value = x + ': '; draft = a.value; a.focus(); }
async function pick(list) {
  const read = f => new Promise(ok => { const r = new FileReader(); r.onload = () => ok({name: f.name, data_b64: r.result}); r.readAsDataURL(f); });
  picked = picked.concat(await Promise.all(Array.from(list || []).map(read))); render();
}
async function tellAgent() {
  const text = $('#ask').value.trim(); if (!text && !picked.length) return;
  const res = await post('/api/agent/tell', {text, files: picked}); picked = []; draft = '';
  if (res && res.ok === false) alert(res.msg); render();
}
let rec = null;
// change one résumé by saying or typing what to change; it is rewritten in the background, then refreshed with a green dot
const REV = {}, REVV = {}, REVD = {};
function reviseBox(c) {
  const id = c.app_id, busy = REV[id] === 'running';
  return `<div class="rev"><div class="rh">Change this résumé</div>
    <textarea id="rev-${id}" placeholder="Say or type what to change…" oninput="REVD[${id}]=this.value" ${busy ? 'disabled' : ''}>${esc(REVD[id] || '')}</textarea>
    <div class="rb"><button class="mic" title="Speak" onclick="speakInto('rev-${id}', this, ${id})">${I.mic}</button>
    <button class="btn sm primary" ${busy ? 'disabled' : ''} onclick="reviseResume(${id})">${busy ? '<span class="spin"></span>Revising…' : 'Revise'}</button></div></div>`;
}
async function reviseResume(id) {
  const t = (REVD[id] || '').trim(); if (!t) return toast('Say or type what to change first.');
  const r = await post(`/api/applications/${id}/revise`, {text: t});
  if (r && r.ok === false) return toast(r.msg);
  REV[id] = 'running'; REVD[id] = ''; render();
  const iv = setInterval(async () => {
    const st = await api(`/api/applications/${id}/revise-status`);
    if (st.state === 'running') return;
    clearInterval(iv);
    REV[id] = st.state === 'done' ? 'done' : 'error'; REVV[id] = Date.now();
    if (st.state !== 'done') toast(st.error || 'Could not revise the résumé.');
    render();
  }, 2500);
}
let recInto = null;
function speakInto(fieldId, btn, id) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert('Voice input needs Chrome or Safari.');
  if (recInto) { recInto.stop(); return; }
  const box = $('#' + fieldId), start = box.value ? box.value + ' ' : '';
  recInto = new SR(); recInto.continuous = true; recInto.interimResults = true; recInto.lang = navigator.language || 'en-US';
  recInto.onresult = e => { box.value = start + Array.from(e.results).map(r => r[0].transcript).join(''); REVD[id] = box.value; };
  recInto.onend = () => { recInto = null; btn.classList.remove('on'); };
  btn.classList.add('on'); recInto.start();
}
function speak() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return alert('Voice input needs Chrome or Safari.');
  if (rec) { rec.stop(); return; }
  rec = new SR(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
  const box = $('#ask'), start = box.value ? box.value + ' ' : '';
  rec.onresult = e => { box.value = start + Array.from(e.results).map(r => r[0].transcript).join(''); draft = box.value; };
  rec.onend = () => { rec = null; $('#mic') && $('#mic').classList.remove('on'); };
  $('#mic').classList.add('on'); rec.start();
}
async function back() { await post('/api/storybook/back'); render(); }
async function prop(id, a) { const r = await post(`/api/proposals/${id}/${a}`); if (r && r.ok === false) alert(r.msg); render(); }

async function renderActivity(p) {
  const ev = await api('/api/events');
  const t = s => new Date(s).toLocaleString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  p.innerHTML = `<div class="ph"><div><h1>Activity</h1><p class="sub">Everything the agent did, newest first.</p></div></div>` + (ev.length
    ? `<div class="feed">${ev.map(e => `<div class="ev"><time>${t(e.at)}</time><span class="node ${esc(e.node)}">${esc(e.node)}</span><div><div>${esc(e.action)}</div>${e.detail ? `<div class="d">${esc(e.detail)}</div>` : ''}</div></div>`).join('')}</div>`
    : '<div class="empty">Nothing yet.</div>');
}

async function render() {
  document.querySelectorAll('aside .nav').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  const p = $('#page');
  if (tab === 'jobs') await renderJobs(p);
  else if (tab === 'storybook') await renderStorybook(p);
  else await renderActivity(p);
}
document.querySelectorAll('aside .nav').forEach(b => b.onclick = () => { tab = b.dataset.tab; clearInterval(poll); render(); });
render(); showRefresh(); setInterval(showRefresh, 60000);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="/static/live-editor.js" defer></script>
</body>
